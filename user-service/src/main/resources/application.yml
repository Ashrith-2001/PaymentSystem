server:
  port: 8081
  shutdown: graceful  # Graceful shutdown — finishes in-flight requests before stopping

spring:
  application:
    name: user-service

  # H2 Database Configuration (PostgreSQL compatibility mode)
  datasource:
    url: jdbc:h2:mem:userdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update  # Auto-create/update tables from entities
    show-sql: true       # Log SQL queries (dev only — disable in prod)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # H2 Console (accessible at http://localhost:8081/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT Configuration
jwt:
  # Base64-encoded secret key (256-bit minimum for HMAC-SHA256)
  # In production: use environment variable or secret manager
  secret: dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgdGhlIHBheW1lbnQgc3lzdGVtIGp3dCBzaWduaW5n
  expiration: 86400000  # 24 hours in milliseconds

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator (health checks, metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Logging Configuration
logging:
  level:
    root: INFO
    com.payment.user: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
